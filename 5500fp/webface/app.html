<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TernOO</title>
<style>
  :root {
    --bg: #16161d; --panel: #1e1e28; --panel2: #232330;
    --ink: #e6e6ec; --dim: #9a9aac; --line: #34344a;
    --accent: #6ea8fe; --accent2: #e8c890; --good: #7dd3a0;
    --code-bg: #2a2a38;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px;
           padding: 10px 18px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .06em; }
  header .sub { color: var(--dim); font-size: 12.5px; }
  header nav { margin-left: auto; display: flex; gap: 6px; }
  .navbtn { background: none; border: 1px solid var(--line);
            color: var(--ink); padding: 6px 14px; border-radius: 7px;
            cursor: pointer; font-size: 13.5px; }
  .navbtn.active { background: var(--accent); color: #10131c;
                   border-color: var(--accent); font-weight: 600; }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 330px; min-width: 240px; background: var(--panel);
          border-right: 1px solid var(--line); overflow-y: auto; }
  aside .letter { padding: 10px 14px; border-bottom: 1px solid var(--line);
                  cursor: pointer; }
  aside .letter:hover { background: var(--panel2); }
  aside .letter.sel { background: var(--panel2);
                      border-left: 3px solid var(--accent); }
  .lfrom { font-weight: 600; font-size: 13.5px; }
  .lsub  { font-size: 13px; color: var(--ink); overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .ldate { font-size: 11.5px; color: var(--dim); }
  section { flex: 1; overflow-y: auto; padding: 22px 30px; min-width: 0; }
  .hidden { display: none !important; }

  /* toolbar — the captain's reference, in the flesh */
  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; position: sticky;
             top: -22px; background: var(--bg); padding: 8px 0;
             border-bottom: 1px solid var(--line); margin-bottom: 14px;
             z-index: 5; }
  .toolbar button { background: var(--panel2); color: var(--ink);
                    border: 1px solid var(--line); border-radius: 6px;
                    min-width: 34px; height: 32px; cursor: pointer;
                    font-size: 14px; }
  .toolbar button:hover { border-color: var(--accent); }
  .toolbar .sep { width: 1px; background: var(--line); margin: 2px 6px; }

  .fields input { width: 100%; background: var(--panel2);
                  border: 1px solid var(--line); color: var(--ink);
                  border-radius: 7px; padding: 9px 12px; font-size: 14px;
                  margin-bottom: 8px; }
  #editor, #composer-body {
    min-height: 320px; background: var(--panel); padding: 18px 22px;
    border: 1px solid var(--line); border-radius: 9px; outline: none; }
  #editor:focus, #composer-body:focus { border-color: var(--accent); }

  /* rendered content — the letterpress */
  .doc h1 { font-size: 26px; margin: .4em 0; color: var(--accent2); }
  .doc h2 { font-size: 21px; margin: .5em 0; color: var(--accent2); }
  .doc h3 { font-size: 17px; margin: .5em 0; color: var(--accent2); }
  .doc p  { margin: .55em 0; }
  .doc ul, .doc ol { margin: .4em 0 .4em 1.4em; }
  .doc code { background: var(--code-bg); padding: 1px 6px;
              border-radius: 5px; color: var(--accent2);
              font-family: "JetBrains Mono", "Fira Code", monospace;
              font-size: 13.5px; }
  .doc pre { background: var(--code-bg); padding: 12px 16px;
             border-radius: 9px; overflow-x: auto; }
  .doc pre code { background: none; padding: 0; }
  .doc a { color: var(--accent); }
  #reader .rfrom { color: var(--dim); font-size: 13px;
                   border-bottom: 1px solid var(--line);
                   padding-bottom: 10px; margin-bottom: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .actions .primary { background: var(--accent); color: #10131c;
                      font-weight: 700; border: none; padding: 10px 22px;
                      border-radius: 8px; cursor: pointer; font-size: 14px; }
  .actions button { background: var(--panel2); color: var(--ink);
                    border: 1px solid var(--line); padding: 9px 16px;
                    border-radius: 8px; cursor: pointer; }
  #toast { position: fixed; bottom: 22px; right: 26px;
           background: var(--panel2); border: 1px solid var(--good);
           color: var(--good); padding: 11px 18px; border-radius: 9px;
           opacity: 0; transition: opacity .3s; pointer-events: none;
           font-size: 13.5px; }
</style>
</head>
<body>
<header>
  <h1>TernOO</h1>
  <span class="sub" id="statusline">connecting to the engine…</span>
  <nav>
    <button class="navbtn active" id="nav-mail" onclick="show('mail')">Mail</button>
    <button class="navbtn" id="nav-compose" onclick="show('compose')">Compose</button>
    <button class="navbtn" id="nav-editor" onclick="show('editor-view')">Editor</button>
  </nav>
</header>
<main>
  <aside id="mailbox"></aside>
  <section id="mail">
    <div id="reader"><p style="color:var(--dim)">Pick a letter from the box.</p></div>
  </section>

  <section id="compose" class="hidden">
    <div class="fields">
      <input id="to" placeholder="To — CC, CF5, CAI, Stevo, crew (commas for several)">
      <input id="subject" placeholder="Subject">
    </div>
    <div class="toolbar">
      <button title="Bold (Ctrl+B)" onclick="cmd('bold')"><b>B</b></button>
      <button title="Italic (Ctrl+I)" onclick="cmd('italic')"><i>I</i></button>
      <button title="Inline code" onclick="inlineCode()">&lt;/&gt;</button>
      <button title="Link" onclick="makeLink()">&#128279;</button>
      <span class="sep"></span>
      <button onclick="blockFmt('h1')">H1</button>
      <button onclick="blockFmt('h2')">H2</button>
      <button onclick="blockFmt('h3')">H3</button>
      <button onclick="blockFmt('p')">¶</button>
      <button title="Bulleted list" onclick="cmd('insertUnorderedList')">•≡</button>
      <button title="Numbered list" onclick="cmd('insertOrderedList')">1≡</button>
      <button title="Code block" onclick="blockFmt('pre')">{ }</button>
    </div>
    <div id="composer-body" class="doc" contenteditable="true"
         spellcheck="true" data-ph="Write the letter — the browser spellchecks, the engine keeps markdown canonical."></div>
    <div class="actions">
      <button class="primary" onclick="sendMail()">Send — the drop is the send</button>
      <button onclick="previewMd('composer-body')">View as Markdown</button>
    </div>
  </section>

  <section id="editor-view" class="hidden">
    <div class="toolbar">
      <button title="Bold" onclick="cmd('bold')"><b>B</b></button>
      <button title="Italic" onclick="cmd('italic')"><i>I</i></button>
      <button title="Inline code" onclick="inlineCode()">&lt;/&gt;</button>
      <button title="Link" onclick="makeLink()">&#128279;</button>
      <span class="sep"></span>
      <button onclick="blockFmt('h1')">H1</button>
      <button onclick="blockFmt('h2')">H2</button>
      <button onclick="blockFmt('h3')">H3</button>
      <button onclick="blockFmt('p')">¶</button>
      <button onclick="cmd('insertUnorderedList')">•≡</button>
      <button onclick="cmd('insertOrderedList')">1≡</button>
      <button onclick="blockFmt('pre')">{ }</button>
      <span class="sep"></span>
      <button title="Load .md" onclick="loadMd()">Open</button>
      <button title="Download .md" onclick="saveMd()">Save .md</button>
      <button title="Download .html" onclick="saveHtml()">Save .html</button>
    </div>
    <div id="editor" class="doc" contenteditable="true" spellcheck="true">
      <h1>TernDoc, in a real face</h1>
      <p>Everything here is <b>native</b>: selection, spellcheck, IME,
      typography. The engine keeps <i>markdown canonical</i> underneath —
      hit <code>Save .md</code> and see.</p>
    </div>
    <input type="file" id="filepick" accept=".md" class="hidden">
  </section>
</main>
<div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let letters = [], current = null;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2600);
}
async function api(path, body) {
  const opt = body ? {method: "POST", body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}
function show(id) {
  for (const s of ["mail", "compose", "editor-view"])
    $(s).classList.toggle("hidden", s !== id);
  for (const b of ["nav-mail", "nav-compose", "nav-editor"])
    b && $(b).classList.remove("active");
  $({"mail": "nav-mail", "compose": "nav-compose",
     "editor-view": "nav-editor"}[id]).classList.add("active");
  $("mailbox").style.display = (id === "mail") ? "" : "none";
}

// — mail —
async function loadBox() {
  letters = await api("/api/mail");
  const box = $("mailbox"); box.innerHTML = "";
  for (const L of letters) {
    const d = document.createElement("div");
    d.className = "letter";
    d.innerHTML = `<div class="lfrom"></div><div class="lsub"></div>
                   <div class="ldate"></div>`;
    d.children[0].textContent = `${L.from} → ${L.to}`;
    d.children[1].textContent = L.subject || L.file;
    d.children[2].textContent = L.file.slice(0, 15);
    d.onclick = () => openLetter(L.file, d);
    box.appendChild(d);
  }
  $("statusline").textContent = `${letters.length} letters in the box`;
}
async function openLetter(file, el) {
  document.querySelectorAll(".letter.sel")
          .forEach(e => e.classList.remove("sel"));
  if (el) el.classList.add("sel");
  const L = await api("/api/mail/" + encodeURIComponent(file));
  current = L;
  $("reader").innerHTML =
    `<div class="rfrom"></div><div class="doc"></div>`;
  $("reader").children[0].textContent = file;
  $("reader").children[1].innerHTML = L.html;   // engine-rendered, selectable
  show("mail");
}

// — editing commands (both surfaces) —
function cmd(c) { document.execCommand(c, false, null); refocus(); }
function blockFmt(tag) { document.execCommand("formatBlock", false, tag); refocus(); }
function makeLink() {
  const url = prompt("Link target (https://…):");
  if (url) document.execCommand("createLink", false, url);
  refocus();
}
function inlineCode() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const code = document.createElement("code");
  try { range.surroundContents(code); } catch (e) {
    document.execCommand("insertHTML", false,
      "<code>" + sel.toString().replace(/[<>&]/g,
        m => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[m])) + "</code>");
  }
  refocus();
}
let lastEditable = "editor";
function refocus() { $(lastEditable) && $(lastEditable).focus(); }
for (const id of ["editor", "composer-body"])
  $(id).addEventListener("focus", () => lastEditable = id);

// — mail send / md round trips —
async function sendMail() {
  const html = $("composer-body").innerHTML;
  const res = await api("/api/send", {
    to: $("to").value, subject: $("subject").value, html: html });
  if (res.dropped) {
    toast(`dropped ${res.dropped} — the watcher takes it from here`);
    $("composer-body").innerHTML = ""; $("subject").value = "";
    setTimeout(loadBox, 4000);
  } else { toast(res.error || "send failed"); }
}
async function previewMd(srcId) {
  const res = await api("/api/convert", {html: $(srcId).innerHTML});
  alert(res.md);
}
async function saveMd() {
  const res = await api("/api/convert", {html: $("editor").innerHTML});
  download("terndoc.md", res.md, "text/markdown");
  toast("markdown saved — the canonical form");
}
async function saveHtml() {
  const res = await api("/api/convert", {html: $("editor").innerHTML});
  const r2 = await api("/api/render", {md: res.md});
  download("terndoc.html",
    "<!DOCTYPE html><html><head><meta charset='utf-8'></head><body>" +
    r2.html + "</body></html>", "text/html");
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function loadMd() { $("filepick").click(); }
$("filepick").addEventListener("change", async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const md = await f.text();
  const res = await api("/api/render", {md});
  $("editor").innerHTML = res.html;
  toast(`opened ${f.name}`);
});

// — keyboard basics —
document.addEventListener("keydown", ev => {
  if (!(ev.ctrlKey || ev.metaKey)) return;
  const k = ev.key.toLowerCase();
  if (k === "b") { ev.preventDefault(); cmd("bold"); }
  if (k === "i") { ev.preventDefault(); cmd("italic"); }
});

loadBox();
</script>
</body>
</html>
